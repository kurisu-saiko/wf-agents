[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wf-agents"
version = "2.0.0"
description = "Human-in-the-loop open-source reuse and engineering assembly workflow plugin with zero-dependency core and 24-tool stdio MCP server."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
full = [
  "httpx>=0.27",
]
dev = [
  "pytest>=8.0",
  "jsonschema>=4.20",
]
