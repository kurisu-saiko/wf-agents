slot: project_search
version: "0.2.0"
license: GitHub-API-Terms
os:
  - windows
  - linux
  - macos
actions:
  - search
  - lookup
  - search_code
  - health
providers:
  github:
    role: primary
    env:
      - GITHUB_TOKEN
      - GH_TOKEN
      - GITHUB_MCP_TOKEN
    endpoint: https://api.github.com
credentials:
  - GITHUB_TOKEN
  - GH_TOKEN
  - GITHUB_MCP_TOKEN
writeSurface: []
timeoutMs: 20000
retry:
  max: 2
  backoffMs: 500
notes: GitHub 仓库发现、详细元数据与代码搜索，自动复用 gh CLI / 环境变量令牌。
