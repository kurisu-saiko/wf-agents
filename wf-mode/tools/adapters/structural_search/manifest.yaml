slot: structural_search
version: "0.2.0"
license: MIT
os:
  - windows
  - linux
  - macos
actions:
  - search
  - symbols
  - health
providers:
  builtin:
    role: primary
    env: []
  ast-grep:
    role: alternate
    env: []
