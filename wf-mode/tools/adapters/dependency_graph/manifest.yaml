slot: dependency_graph
version: "0.2.0"
license: MIT
os:
  - windows
  - linux
  - macos
actions:
  - graph
  - analyze
  - health
providers:
  builtin:
    role: primary
    env: []
  pydeps:
    role: alternate
    env: []
