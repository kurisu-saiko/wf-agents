slot: web_extract
version: "0.2.0"
license: commercial-api-and-public
os:
  - windows
  - linux
  - macos
actions:
  - extract
  - health
providers:
  firecrawl:
    role: primary
    env:
      - FIRECRAWL_API_KEY
      - FIRECRAWL
    endpoint: https://api.firecrawl.dev/v1/scrape
  jina:
    role: alternate
    env:
      - JINA_API_KEY
      - JINA
    endpoint: https://r.jina.ai/
  direct:
    role: alternate
    env: []
    notes: 零密钥内置直抓与 HTML->Markdown 解析器，并自动将 GitHub blob 链接转为 raw。
credentials:
  - FIRECRAWL_API_KEY
  - FIRECRAWL
  - JINA_API_KEY
  - JINA
writeSurface: []
timeoutMs: 30000
retry:
  max: 2
  backoffMs: 500
notes: Firecrawl -> Jina -> Direct 三级正文抽取链。
