# 能力目录：装配工具与外部能力。
# kind: adapter（内部零依赖适配器）| cli（本地工具）| mcp（宿主 MCP）| pending（待开放写能力）
# status: active（已接入）| pending（仅登记）| missing（运行时不健康）
version: 1

runtime:
  # 默认留空；用 .wf/config.local.json 或 WF_BIN/WF_VENV 覆盖，也可自动探测 PATH。
  bin: ""
  venv: ""

capabilities:
  web_search:
    label: 网页搜索
    kind: adapter
    actions: [search, health]
    providers: [tavily, exa, brave, searxng, duckduckgo]
    primary: tavily
    alternate: exa
    fallback: [brave, searxng, duckduckgo]
    env: [TAVILY_API_KEY, TAVILY, EXA_API_KEY, EXA, BRAVE_API_KEY, BRAVE, SEARXNG_URL]
    status: active
    notes: Tavily -> Exa -> Brave -> SearXNG -> DuckDuckGo（零密钥兜底）。

  web_extract:
    label: 网页正文抽取
    kind: adapter
    actions: [extract, health]
    providers: [firecrawl, jina, direct]
    primary: firecrawl
    alternate: jina
    fallback: [direct]
    env: [FIRECRAWL_API_KEY, FIRECRAWL, JINA_API_KEY, JINA]
    status: active
    notes: Firecrawl -> Jina -> Direct（零密钥内置 HTML->Markdown，支持 GitHub blob 转 raw）。

  project_search:
    label: 项目与代码发现
    kind: adapter
    actions: [search, lookup, search_code, health]
    providers: [github]
    primary: github
    alternate: null
    env: [GITHUB_TOKEN, GH_TOKEN, GITHUB_MCP_TOKEN]
    status: active
    notes: GitHub 仓库发现、详细元数据与代码搜索，自动复用 gh CLI 登录令牌。

  repo_ingest:
    label: 仓库与项目读取
    kind: adapter
    actions: [ingest, tree, read, readme, health]
    providers: [github_api, local, gitingest]
    primary: github_api
    alternate: local
    fallback: [gitingest]
    exec:
      gitingest: ["{WF_VENV}/Scripts/gitingest.exe", "{repo}", "--output", "-"]
    env: [GITHUB_TOKEN, GH_TOKEN, GITHUB_MCP_TOKEN]
    status: active
    notes: 无需克隆即可读取 GitHub/本地文件树、文件行片段、README 与高信噪比摘要。

  repo_health:
    label: 仓库维护健康度
    kind: adapter
    actions: [analyze, health]
    providers: [github]
    primary: github
    alternate: null
    env: [GITHUB_TOKEN, GH_TOKEN, GITHUB_MCP_TOKEN]
    status: active
    notes: 评估提交活跃度、总线因子、Release 节奏、许可证类别与维护风险标记。

  package_meta:
    label: 包与发布元数据
    kind: adapter
    actions: [lookup, search, health]
    providers: [auto, pypi, npm, crates, github]
    primary: auto
    alternate: pypi
    fallback: [npm, crates, github]
    env: [GITHUB_TOKEN, GH_TOKEN, GITHUB_MCP_TOKEN]
    status: active
    notes: 零密钥查询 PyPI / npm / crates.io / GitHub 包版本、下载量与许可信息。

  package_security:
    label: 依赖漏洞扫描
    kind: adapter
    actions: [scan, query, health]
    providers: [osv, scorecard]
    primary: osv
    alternate: scorecard
    exec:
      scorecard: ["{WF_BIN}/scorecard/scorecard.exe", "--repo={repo}", "--format=json"]
    env: []
    status: active
    notes: 通过 OSV.dev 实时漏洞库检查单包或本地/GitHub 仓库依赖的 CVE/GHSA。

  license_sbom:
    label: 许可证与 SBOM
    kind: adapter
    actions: [scan, health]
    providers: [builtin, syft]
    primary: builtin
    alternate: syft
    exec:
      syft: ["{WF_BIN}/syft/syft.exe", "scan", "{path}", "-o", "json"]
    env: []
    status: active
    notes: 内置 SPDX 许可证风险分类（宽松/弱传染/强传染）与多生态依赖清单扫描。

  dependency_graph:
    label: 架构与依赖分析
    kind: adapter
    actions: [graph, analyze, health]
    providers: [builtin, pydeps]
    primary: builtin
    alternate: pydeps
    exec:
      pydeps: ["{WF_VENV}/Scripts/pydeps.exe", "{path}", "--show-deps", "--no-output", "--noshow"]
    env: []
    status: active
    notes: 零依赖多语言（Python AST / JS-TS / Go / Rust）模块依赖图、核心枢纽与循环依赖检测。

  structural_search:
    label: 结构搜索与符号大纲
    kind: adapter
    actions: [search, symbols, health]
    providers: [builtin, ast-grep]
    primary: builtin
    alternate: ast-grep
    exec:
      ast-grep: ["{WF_BIN}/ast-grep/ast-grep.exe", "run", "--pattern", "{pattern}", "--lang", "{lang}", "--json=compact", "{path}"]
    env: []
    status: active
    notes: 内置正则/字面量搜索与多语言符号提取，并兼容 ast-grep CLI。

  scaffold:
    label: 模板/脚手架
    kind: cli
    actions: [render, health]
    providers: [copier]
    primary: copier
    alternate: null
    exec:
      copier: ["{WF_VENV}/Scripts/copier.exe", "copy", "{template}", "{destination}", "--defaults"]
    env: []
    status: active
    notes: 会写文件；只允许在执行阶段、用户批准后调用，计划阶段禁用。

  code_graph:
    label: 代码图/架构
    kind: pending
    actions: [index, query, impact, health]
    providers: [codebase-memory-mcp]
    primary: codebase-memory-mcp
    env: []
    status: pending
    notes: 可选外部 MCP 扩展位；核心代码结构分析已由 dependency_graph 与 structural_search 提供。

  repo_fetch:
    label: 取仓库子集
    kind: pending
    actions: [fetch, health]
    providers: [git-sparse-checkout, degit]
    primary: git-sparse-checkout
    env: []
    status: pending
    notes: 会写临时文件；需在执行阶段使用，只读调研请用 repo_ingest。

  toolchain:
    label: 工具链初始化
    kind: pending
    actions: [init, health]
    providers: [uv, npm, pnpm]
    primary: uv
    env: []
    status: pending
    notes: 会写项目文件、装依赖；计划阶段禁用。

  deploy_runtime:
    label: 运行时/服务
    kind: pending
    actions: [plan, apply, health]
    providers: [winsw, waitress, caddy]
    primary: winsw
    env: []
    status: pending
    notes: 涉及部署，必须用户批准；第一版不开放。

  reverse_proxy:
    label: 反向代理
    kind: pending
    actions: [plan, apply, health]
    providers: [caddy]
    primary: caddy
    env: []
    status: pending
    notes: 涉及共享服务配置，必须用户批准；第一版不开放。

  managed_platform:
    label: 托管部署
    kind: pending
    actions: [plan, apply, health]
    providers: [vercel, netlify, cloudflare, azure]
    primary: vercel
    env: []
    status: pending
    notes: 依赖账号与额度，必须用户批准；第一版不开放。
