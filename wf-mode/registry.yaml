# 能力槽电话簿（Phase 1）。
# 只登记第一阶段真实存在、可被 wf-tool 调用的槽。
slots:
  web_search:
    purpose: 通用网页搜索
    actions:
      - search
      - health
    primary: tavily
    alternate: exa
    status: active
    license: commercial-api
    os:
      - windows
      - linux
      - macos
    credentials:
      - TAVILY_API_KEY
      - TAVILY
      - EXA_API_KEY
      - EXA
    fallback:
      - exa
    calibratedAt: "2026-10-27"
    invalidation: 任一可用动作失败，先怀疑清单过期，重测并回写

  web_extract:
    purpose: 网页正文抽取
    actions:
      - extract
      - health
    primary: firecrawl
    alternate: jina
    status: active
    license: commercial-api
    os:
      - windows
      - linux
      - macos
    credentials:
      - FIRECRAWL_API_KEY
      - FIRECRAWL
      - JINA_API_KEY
      - JINA
    fallback:
      - jina
    calibratedAt: "2026-10-27"
    invalidation: 任一可用动作失败，先怀疑清单过期，重测并回写

  project_search:
    purpose: 项目发现
    actions:
      - search
      - lookup
      - health
    primary: github
    alternate: null
    status: active
    license: GitHub-API-Terms
    os:
      - windows
      - linux
      - macos
    credentials:
      - GITHUB_TOKEN
      - GH_TOKEN
      - GITHUB_MCP_TOKEN
    fallback: []
    calibratedAt: "2026-10-27"
    invalidation: GitHub API 版本或限流策略变化时重测

  ledger:
    purpose: 写账本
    actions:
      - commit
      - validate
    primary: internal
    alternate: null
    status: active
    license: internal
    os:
      - windows
      - linux
      - macos
    credentials: []
    fallback: []
    calibratedAt: "2026-10-27"
    invalidation: 账本 schema 变化时重测
